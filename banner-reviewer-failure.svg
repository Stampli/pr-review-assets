<svg xmlns="http://www.w3.org/2000/svg" width="880" height="72" viewBox="0 0 880 72" role="img" aria-label="Reviewer failure" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
<title>Reviewer failure</title>
<desc>Grey banner: the AI reviewer did not reach a verdict; this is not a finding about the pull request.</desc>
<defs>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#939293" stop-opacity="0"/>
<stop offset="0.5" stop-color="#939293" stop-opacity="0.18"/>
<stop offset="1" stop-color="#939293" stop-opacity="0"/>
</linearGradient>
<clipPath id="card"><rect x="1" y="1" width="878" height="70" rx="10"/></clipPath>
</defs>
<style>
.frame { stroke-dasharray: 1900; stroke-dashoffset: 0; animation: draw 1.2s ease-out 0s 1 both; }
.glyph { stroke-dasharray: 80; stroke-dashoffset: 0; animation: draw-glyph 0.6s ease-out 0.8s 1 both; }
.label { opacity: 1; transform: translateY(0); animation: rise 0.6s ease-out 0.9s 1 both; }
.sub { opacity: 1; animation: fade 0.5s ease-out 1.5s 1 both; }
.shine { transform: translateX(0); animation: sweep 1s ease-in-out 1.4s 1 both; }
@keyframes draw { from { stroke-dashoffset: 1900; } }
@keyframes draw-glyph { from { stroke-dashoffset: 80; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes sweep { from { transform: translateX(-880px); } }
@media (prefers-reduced-motion: reduce) { .frame, .glyph, .label, .sub, .shine { animation: none; } }
</style>
<rect x="1" y="1" width="878" height="70" rx="10" fill="#0d1017" stroke="#282d35"/>
<rect class="frame" x="1" y="1" width="878" height="70" rx="10" fill="none" stroke="#939293" stroke-width="1.5"/>
<g clip-path="url(#card)"><rect class="shine" x="0" y="0" width="880" height="72" fill="url(#shine)"/></g>
<circle cx="40" cy="36" r="16" fill="none" stroke="#939293" stroke-width="1.5" opacity="0.6"/>
<path class="glyph" d="M33 29 L47 43 M47 29 L33 43" fill="none" stroke="#939293" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="label" x="76" y="33" fill="#939293" font-size="18" font-weight="700" letter-spacing="2">REVIEWER FAILURE</text>
<text class="sub" x="76" y="55" fill="#8b949e" font-size="12">no verdict recorded</text>
<text x="862" y="43" fill="#8b949e" font-size="11" text-anchor="end" opacity="0.7">DevOps PR review</text>
</svg>
