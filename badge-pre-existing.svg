<svg xmlns="http://www.w3.org/2000/svg" width="96" height="20" viewBox="0 0 96 20" role="img" aria-label="Pre-existing" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
<title>Pre-existing</title>
<desc>Severity badge reading PRE-EXISTING, drawn as a dark pill with a #ab9df2 border.</desc>
<style>
.b { stroke-dasharray: 224; stroke-dashoffset: 0; animation: draw 0.5s ease-out 0s 1 both; }
.t { opacity: 1; animation: fade 0.3s ease-out 0.3s 1 both; }
@keyframes draw { from { stroke-dashoffset: 224; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .b, .t { animation: none; } }
</style>
<rect x="0.5" y="0.5" width="95" height="19" rx="6" fill="#0d1017"/>
<rect class="b" x="0.5" y="0.5" width="95" height="19" rx="6" fill="none" stroke="#ab9df2" stroke-width="1"/>
<text class="t" x="48" y="14" fill="#ab9df2" font-size="11" font-weight="700" letter-spacing="0.5" text-anchor="middle">PRE-EXISTING</text>
</svg>
